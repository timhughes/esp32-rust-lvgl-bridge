[package]
name = "esp32-rust-lvgl-bridge-harness"
version = "0.1.0"
edition = "2021"
authors = ["Tim Hughes"]
description = "Headless LVGL host test harness for pure Rust unit & visual QA tests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timhughes/esp32-rust-lvgl-framework"
readme = "README.md"
keywords = ["esp32", "lvgl", "testing", "headless", "screenshot"]
categories = ["embedded", "gui", "development-tools::testing"]

[dependencies]
esp32-rust-lvgl-bridge-core = { version = "0.1.0", path = "../esp32-rust-lvgl-bridge-core" }

[build-dependencies]
cc = "1.8.0"

