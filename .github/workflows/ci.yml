name: CI / Automated Visual QA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace-tests:
    name: Rust Workspace Checks & Headless Visual QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make git libpng-dev

      - name: Setup Rust Nightly Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Run Workspace Tests & Headless Visual QA
        run: cargo test --workspace --verbose

      - name: Verify Rustdoc
        run: cargo doc --workspace --no-deps

      - name: Upload Visual QA Screenshot Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-snapshots
          path: |
            artifacts/*.png
            docs/src/artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14

  docs-build:
    name: mdBook Documentation PR Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install mdBook
        run: |
          curl -sL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xz -C /usr/local/bin
          mdbook --version

      - name: Build Documentation Book
        run: mdbook build

      - name: Upload mdBook Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mdbook-html
          path: docs/book/
          retention-days: 14
